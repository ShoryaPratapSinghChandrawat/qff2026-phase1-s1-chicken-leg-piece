name: Phase 2 additional-research validation

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-local-lock.txt
      - name: Install locked project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local-lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Verify submission
        run: python verify_submission.py
